# tmux colors — auto-generated by wallust, do not edit manually

set -g mode-style "fg=#141213,bg=#73807F"

set -g message-style "fg=#E8E3D8,bg=#373636"
set -g message-command-style "fg=#E8E3D8,bg=#373636"

set -g pane-border-style "fg=#373636"
set -g pane-active-border-style "fg=#8F9999"

set -g status-style "fg=#E8E3D8,bg=#141213"

set -g status-left "#[fg=#141213,bg=#73807F,bold] #S #[fg=#73807F,bg=#141213,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#141213,bg=#141213,nobold,nounderscore,noitalics]#[fg=#E8E3D8,bg=#141213] #{prefix_highlight} #[fg=#373636,bg=#141213,nobold,nounderscore,noitalics]#[fg=#E8E3D8,bg=#373636] %Y-%m-%d  %I:%M %p #[fg=#73807F,bg=#373636,nobold,nounderscore,noitalics]#[fg=#141213,bg=#73807F,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#141213,bg=#141213,nobold,nounderscore,noitalics]#[fg=#E8E3D8,bg=#141213] #{prefix_highlight} #[fg=#373636,bg=#141213,nobold,nounderscore,noitalics]#[fg=#E8E3D8,bg=#373636] %Y-%m-%d  %H:%M #[fg=#73807F,bg=#373636,nobold,nounderscore,noitalics]#[fg=#141213,bg=#73807F,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#D6CFBF,bg=#141213"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#969186,bg=#141213"
setw -g window-status-format "#[fg=#141213,bg=#141213,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#141213,bg=#141213,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#141213,bg=#73807F,nobold,nounderscore,noitalics]#[fg=#141213,bg=#73807F,bold] #I  #W #F #[fg=#73807F,bg=#141213,nobold,nounderscore,noitalics]"
