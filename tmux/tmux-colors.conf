# tmux colors — auto-generated by wallust, do not edit manually

set -g mode-style "fg=#0E1012,bg=#72808E"

set -g message-style "fg=#E6EDF5,bg=#323436"
set -g message-command-style "fg=#E6EDF5,bg=#323436"

set -g pane-border-style "fg=#323436"
set -g pane-active-border-style "fg=#8E99A5"

set -g status-style "fg=#E6EDF5,bg=#0E1012"

set -g status-left "#[fg=#0E1012,bg=#72808E,bold] #S #[fg=#72808E,bg=#0E1012,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#0E1012,bg=#0E1012,nobold,nounderscore,noitalics]#[fg=#E6EDF5,bg=#0E1012] #{prefix_highlight} #[fg=#323436,bg=#0E1012,nobold,nounderscore,noitalics]#[fg=#E6EDF5,bg=#323436] %Y-%m-%d  %I:%M %p #[fg=#72808E,bg=#323436,nobold,nounderscore,noitalics]#[fg=#0E1012,bg=#72808E,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#0E1012,bg=#0E1012,nobold,nounderscore,noitalics]#[fg=#E6EDF5,bg=#0E1012] #{prefix_highlight} #[fg=#323436,bg=#0E1012,nobold,nounderscore,noitalics]#[fg=#E6EDF5,bg=#323436] %Y-%m-%d  %H:%M #[fg=#72808E,bg=#323436,nobold,nounderscore,noitalics]#[fg=#0E1012,bg=#72808E,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#D2DDE9,bg=#0E1012"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#939BA3,bg=#0E1012"
setw -g window-status-format "#[fg=#0E1012,bg=#0E1012,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#0E1012,bg=#0E1012,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#0E1012,bg=#72808E,nobold,nounderscore,noitalics]#[fg=#0E1012,bg=#72808E,bold] #I  #W #F #[fg=#72808E,bg=#0E1012,nobold,nounderscore,noitalics]"
