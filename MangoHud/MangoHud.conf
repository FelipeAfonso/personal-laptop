# --- Diagnostic overlay for FPS-drop investigation ---
fps
frametime=1
frame_timing=1

# GPU: load, clocks, all temps, power, and WHY it throttles
gpu_stats
gpu_load_change
gpu_core_clock
gpu_mem_clock
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_power
throttling_status          # shows "throttling: thermal/power" live
throttling_status_graph

# Memory: the prime suspect. Watch VRAM hit ceiling -> GTT climbs
vram
gtt
ram

# CPU sanity-check (rule out CPU-side stalls)
cpu_stats
cpu_load_change
cpu_temp
cpu_power

# Readability
position=top-left
font_size=20
table_columns=3
background_alpha=0.4
toggle_hud=Shift_L+F12
